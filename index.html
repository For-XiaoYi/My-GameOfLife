<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>生命游戏 · Conway's Game of Life</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo"></span>
          <div class="brand-text">
            <strong>生命游戏</strong>
            <small>Conway's Game of Life</small>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><label>代数</label><b id="stat-gen">0</b></div>
          <div class="stat"><label>人口</label><b id="stat-pop">0</b></div>
          <div class="stat"><label>速度</label><b id="stat-speed">10</b><i>代/秒</i></div>
          <div class="stat"><label>可回溯</label><b id="stat-hist">1</b><i>代</i></div>
        </div>

        <div class="top-actions">
          <button class="iconbtn" id="btn-settings" data-tip="画布设置：比例 / 尺寸 / 边界" aria-label="画布设置">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
          </button>
          <button class="iconbtn chip" id="tgl-grid" data-tip="网格 (G)" aria-label="网格">
            <svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg>
          </button>
          <button class="iconbtn" id="btn-studio" data-tip="内容库：时刻 / 时段 / 分享 / 导入导出" aria-label="内容库">
            <svg viewBox="0 0 24 24"><path d="M4 7.6 12 4l8 3.6-8 3.6-8-3.6Z"/><path d="M4 12.2l8 3.6 8-3.6"/><path d="M4 16.8 12 20.4l8-3.6"/></svg>
          </button>
          <button class="iconbtn" id="btn-fullscreen" data-tip="全屏观察 (F)" aria-label="全屏观察">
            <svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg>
          </button>
          <button class="iconbtn" id="btn-help" data-tip="帮助" aria-label="帮助">?</button>
        </div>
      </header>

      <main id="stage">
        <canvas id="board"></canvas>

        <div id="toolbar">
          <button class="tool" data-tool="brush" title="画笔 (B)">
            <svg viewBox="0 0 24 24"><path d="M4.5 19.5l1-3.5 9.2-9.2a1.9 1.9 0 0 1 2.7 2.7l-9.2 9.2-3.7.8z"/><path d="M12.6 6.9l2.7 2.7"/></svg>
          </button>
          <button class="tool" data-tool="erase" title="橡皮 (E)">
            <svg viewBox="0 0 24 24"><path d="M9.5 4.6l8.4 8.4a1.6 1.6 0 0 1 0 2.3l-3 3H9.2l-4-4a1.6 1.6 0 0 1 0-2.3l4.3-4.3z"/><path d="M7.2 11.8l5.6 5.6"/><path d="M4 20h16"/></svg>
          </button>
          <button class="tool" data-tool="line" title="直线 (I)">
            <svg viewBox="0 0 24 24"><path d="M6.5 17.5L17.5 6.5"/><circle cx="5.4" cy="18.6" r="1.5"/><circle cx="18.6" cy="5.4" r="1.5"/></svg>
          </button>
          <button class="tool" data-tool="rect" title="矩形 (U)">
            <svg viewBox="0 0 24 24"><rect x="4.5" y="6.5" width="15" height="11" rx="1.6"/></svg>
          </button>
          <button class="tool" data-tool="stamp" title="贴图 (S)">
            <svg viewBox="0 0 24 24"><path d="M4.6 8.6V5.6a1 1 0 0 1 1-1h3"/><path d="M15.4 4.6h3a1 1 0 0 1 1 1v3"/><path d="M19.4 15.4v3a1 1 0 0 1-1 1h-3"/><path d="M8.6 19.4h-3a1 1 0 0 1-1-1v-3"/><path d="M9.6 9.6h4.8v4.8H9.6z"/></svg>
          </button>
          <button class="tool" data-tool="select" title="选择框 (K)">
            <svg viewBox="0 0 24 24" stroke-dasharray="3 2.4"><rect x="4.5" y="4.5" width="15" height="15" rx="1.2"/></svg>
          </button>
          <button class="tool active" data-tool="pan" title="平移 (H / 右键拖拽)；画面转远了按 Shift+0 回正">
            <svg viewBox="0 0 24 24"><path d="M12 3.4v17.2M3.4 12h17.2"/><path d="M9.6 5.8L12 3.4l2.4 2.4M9.6 18.2L12 20.6l2.4-2.4M5.8 9.6L3.4 12l2.4 2.4M18.2 9.6L20.6 12l-2.4 2.4"/></svg>
          </button>
        </div>

        <aside id="palette">
          <div id="palette-resize" title="拖动调整图案库宽度"></div>
          <header>
            <h3>图案库</h3>
            <button id="btn-lib-manage" class="icon" title="管理分类与图案">⚙</button>
            <button id="btn-palette-collapse" class="icon" title="收起">›</button>
          </header>
          <div id="palette-list"></div>
          <footer>
            <button id="btn-rotate" title="旋转 (R)">旋转 0°</button>
            <button id="btn-mirror" title="镜像 (M)">镜像</button>
          </footer>
        </aside>

        <div id="sel-bar" class="hidden">
          <span id="sel-info">0 × 0</span>
          <button id="btn-del-selection" title="删除选区内容 (Del)">删除</button>
          <button id="btn-save-preset" class="primary">存为图案</button>
          <button id="btn-sel-cancel" title="退出选择框 (Esc)">取消</button>
        </div>

        <div id="hint">
          <span data-hint="draw">拖拽平移画布</span><i>·</i><span data-hint="mid">0 适应视图</span
          ><i>·</i><span data-hint="wheel">滚轮缩放</span>
        </div>

        <div id="rec-badge" class="hidden">● 录制中 <b id="rec-count">0</b> 代</div>
      </main>

      <footer id="bottombar">
        <div class="play">
          <button id="btn-prev" title="上一代 (←)">◀</button>
          <button id="btn-play" class="primary" title="播放 / 暂停 (P)">▶</button>
          <button id="btn-next" title="下一代 (→)">▶|</button>
          <button id="btn-clear" title="清空世界">清空</button>
          <button id="btn-random" title="随机播种">随机</button>
          <button id="btn-undo" title="撤销 (Ctrl+Z)">↶</button>
          <button id="btn-redo" title="重做 (Ctrl+Shift+Z)">↷</button>
        </div>

        <div class="speed">
          <label for="speed">速度</label>
          <input id="speed" type="range" min="0" max="100" step="1" value="52" />
          <span id="speed-label">10 代/秒</span>
          <button class="chip" id="btn-unlimited" title="不限速">∞</button>
        </div>

        <div class="timeline">
          <input id="timeline" type="range" min="0" max="0" step="1" value="0" />
          <span id="timeline-label">第 0 代</span>
        </div>

        <div class="rec">
          <label class="rec-depth" title="往回可以看多少代（超出内存上限会先丢最早的记录）">
            <span>回溯</span>
            <button class="menubtn" id="depth-select" title="回溯深度"><span class="menubtn-label">3,000 代</span><i class="menubtn-caret"></i></button>
          </label>
          <button id="btn-record" class="btn danger">● 录制片段</button>
        </div>
      </footer>
    </div>

    <div id="modal" class="hidden">
      <div class="modal-mask" data-close="1"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <header>
          <h2 id="modal-title">标题</h2>
          <button class="icon" id="modal-close" title="关闭">×</button>
        </header>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toast"></div>

    <div id="tip" class="hidden"></div>

    <div id="fs-bar" class="hidden">
      <button id="fs-play" class="fs-btn" data-tip="播放 / 暂停 (Space)">▶</button>
      <span id="fs-gen" class="fs-stat">第 0 代</span>
      <span id="fs-pop" class="fs-stat">人口 0</span>
      <button id="fs-exit" class="fs-btn fs-exit" data-tip="退出全屏 (Esc)">退出</button>
    </div>

    <div id="confirm" class="hidden">
      <div class="confirm-card" role="dialog" aria-modal="true">
        <h4 id="confirm-title">确认</h4>
        <p id="confirm-msg"></p>
        <div class="confirm-actions">
          <button class="btn" id="confirm-cancel">取消</button>
          <button class="btn primary" id="confirm-ok">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
