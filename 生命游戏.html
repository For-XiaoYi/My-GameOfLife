<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>生命游戏 · Conway's Game of Life</title>
    <style>
:root {
  --bg: #05080c;
  --panel: rgba(13, 20, 28, 0.92);
  --panel-solid: #0d141c;
  --line: rgba(120, 200, 220, 0.14);
  --line-strong: rgba(120, 200, 220, 0.28);
  --text: #dbe9ee;
  --dim: #7b939e;
  --accent: #6cf5d2;
  --accent-dim: rgba(108, 245, 210, 0.16);
  --danger: #ff7a7a;
  --radius: 10px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 主题：让原生下拉列表 / 滚动条也走暗色 ---------- */
button,
:root {
  color-scheme: dark;
}

/* 不要给 option 设背景或文字色：
   Windows 的原生弹层仍会用系统高亮色刷选中项与悬停项，但文字沿用这里设的浅色，
   结果"浅字压浅蓝底"糊成一片。交给 color-scheme: dark 让浏览器自己画。 */

/* 但 color-scheme 在部分 Windows Chromium 上不生效（弹层仍是纯白），
   所以再补一层显式的暗色兜底；选中项单独给一个足够对比的底色。 */
select,
.select-input {
  color-scheme: dark;
}

select option,
select optgroup,
.select-input option {
  background-color: #0d161d;
  color: #e8f4f6;
}

select option:checked,
.select-input option:checked {
  background-color: #1d4f4c;
  color: #ffffff;
}

select,
input {
  font: inherit;
  color: inherit;
}

#app {
  display: grid;
  grid-template-rows: 52px minmax(0, 1fr) 58px;
  height: 100dvh;
  width: 100vw;
}

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 14px;
  background: var(--panel-solid);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
}

.logo {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background:
    radial-gradient(circle at 30% 30%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 70% 30%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 50% 62%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 30% 88%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 70% 88%, var(--accent) 0 2px, transparent 2.5px),
    #101c25;
  box-shadow: 0 0 0 1px var(--line-strong), 0 0 16px rgba(108, 245, 210, 0.18);
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.brand-text strong {
  font-size: 14px;
  letter-spacing: 0.04em;
}

.brand-text small {
  font-size: 9.5px;
  color: var(--dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.stats {
  display: flex;
  gap: 4px;
  flex: 0 0 auto;
}

.stat {
  display: flex;
  align-items: baseline;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.028);
  border: 1px solid transparent;
}

.stat label {
  font-size: 10.5px;
  color: var(--dim);
  letter-spacing: 0.05em;
}

.stat b {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 13px;
  color: var(--accent);
}

.stat i {
  font-style: normal;
  font-size: 10px;
  color: var(--dim);
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 1 auto;
  min-width: 0;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}

.top-actions::-webkit-scrollbar {
  display: none;
}

select,
.btn,
.chip {
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
  transition:
    background 0.14s,
    border-color 0.14s,
    color 0.14s;
  white-space: nowrap;
}

select {
  padding: 0 26px 0 10px;
  appearance: none;
  text-align: left;
  background-color: rgba(255, 255, 255, 0.03);
  /* 自绘箭头：appearance:none 会把浏览器自带的箭头一起去掉，不补就看不出来能展开 */
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%238ba7b3' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 9px center;
}

.btn:hover,
.chip:hover,
select:hover {
  /* 用 background-color 而不是 background：后者会把自绘的箭头一起重置掉 */
  background-color: rgba(108, 245, 210, 0.1);
  border-color: var(--line-strong);
}

select:focus-visible,
.btn:focus-visible,
.chip:focus-visible {
  outline: none;
  border-color: rgba(108, 245, 210, 0.65);
  box-shadow: 0 0 0 3px rgba(108, 245, 210, 0.14);
}

.chip.on {
  background: var(--accent-dim);
  border-color: rgba(108, 245, 210, 0.5);
  color: var(--accent);
}

.btn.icon,
button.icon {
  width: 30px;
  padding: 0;
  display: inline-grid;
  place-items: center;
}

.btn.danger {
  color: #ffb4b4;
  border-color: rgba(255, 122, 122, 0.32);
}

.btn.danger.on {
  background: rgba(255, 90, 90, 0.2);
  border-color: rgba(255, 122, 122, 0.7);
  color: #fff;
}

/* ---------- 舞台 ---------- */
#stage {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  touch-action: none;
}

#board {
  position: absolute;
  inset: 0;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

#stage.panning #board {
  cursor: grabbing;
}

#toolbar {
  position: absolute;
  left: 12px;
  top: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

.tool {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
}

.tool svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tool:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
}

.tool.active {
  color: #04120f;
  background: var(--accent);
  box-shadow: 0 0 14px rgba(108, 245, 210, 0.45);
}

#palette {
  position: absolute;
  right: 12px;
  top: 12px;
  bottom: 12px;
  width: 236px;
  display: flex;
  flex-direction: column;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  overflow: hidden;
  transition: width 0.16s ease;
}

#palette.collapsed {
  width: 40px;
  height: 40px;
  bottom: auto;
  padding: 0;
}

#palette.collapsed #palette-list,
#palette.collapsed footer,
#palette.collapsed header h3,
#palette.collapsed header .icon:not(#btn-palette-collapse) {
  display: none;
}

#palette.collapsed header {
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 0;
  border-bottom: none;
}

/* ── 编辑模式 ─────────────────────────────────────────────────────────── */
#palette.edit {
  width: 336px;
}

#palette.edit footer {
  display: none;
}

#palette.edit #btn-lib-manage {
  color: var(--accent);
  background: rgba(108, 245, 210, 0.14);
}

/* 拖动左边缘改宽度（浏览与编辑模式都可用） */
#palette-resize {
  position: absolute;
  left: -3px;
  top: 0;
  bottom: 0;
  width: 10px;
  cursor: ew-resize;
  display: block;
  z-index: 6;
}

#palette.collapsed #palette-resize,
#palette.collapsed ~ #palette-resize {
  display: none;
}

#palette-resize::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 50%;
  width: 2px;
  height: 40px;
  margin-top: -20px;
  border-radius: 2px;
  background: rgba(108, 245, 210, 0);
  transition: background 0.15s ease;
}

#palette-resize:hover::after {
  background: rgba(108, 245, 210, 0.55);
}

#palette-list.edit-list {
  padding: 8px 8px 12px;
}

.edit-cat {
  margin-bottom: 7px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}

.edit-cat-head {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 6px;
  cursor: grab;
}

#palette header h3 {
  margin-right: auto;
}

#palette:not(.collapsed) header {
  justify-content: flex-start;
}

.edit-cat-head:active {
  cursor: grabbing;
}

.edit-cat-head input {
  min-width: 0;
}

/* 名称栏不占满整行，右边留出大块空白当拖拽区 */
.edit-cat-head .text-input.grow {
  flex: 0 1 104px;
  min-width: 54px;
}

.edit-cat-head:hover {
  background: rgba(255, 255, 255, 0.035);
}

.edit-cat-head .grip {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  align-self: stretch;
  padding-right: 2px;
  min-width: 56px;
  min-height: 22px;
}

.edit-cat-head:hover .grip {
  color: var(--text);
}

.edit-cat-head.drop-target,
.edit-cat-head.drop-into {
  background: rgba(108, 245, 210, 0.12);
  outline: 1px solid var(--accent);
}

.edit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
  gap: 6px;
  padding: 2px 8px 9px;
}

.edit-tile {
  /* 指针驱动的排序要吃掉触摸滚动，否则手机上拖不动 */
  touch-action: none;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 5px 3px 4px;
  border: 1px solid rgba(120, 200, 220, 0.12);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.02);
  cursor: grab;
}

.edit-tile:hover {
  background: rgba(108, 245, 210, 0.08);
  border-color: var(--line-strong);
}

.edit-tile canvas {
  width: 52px;
  height: 34px;
  image-rendering: pixelated;
}

.edit-tile .tile-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10.5px;
  color: var(--dim);
}

.edit-tile .tile-stash {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 19px;
  height: 19px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: #0d151d;
  color: var(--dim);
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.12s ease;
}

.edit-tile:hover .tile-stash {
  opacity: 1;
}

.edit-tile .tile-stash:hover {
  color: var(--text);
  border-color: var(--accent);
}

.edit-tile .tile-del {
  position: absolute;
  top: -6px;
  left: -6px;
  width: 19px;
  height: 19px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(255, 122, 122, 0.5);
  background: #0d151d;
  color: var(--danger);
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.12s ease;
}

.edit-tile:hover .tile-del {
  opacity: 1;
}

.edit-tile.drop-target {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* 拖动时被拿起来的那个方块 */
/* 拖起来的那一项：内容不显示，只留一个很淡的空框当「缺口」。
   不能真的 display:none / 移出布局——动了拖拽源节点浏览器会当场取消这次拖拽 */
.edit-tile.dragging {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
}

.edit-tile.dragging > * {
  visibility: hidden;
}

.edit-cat.dragging > .edit-cat-head {
  background: transparent;
  outline: none;
}

.edit-cat.dragging .edit-cat-head > *,
.edit-cat.dragging .edit-grid,
.edit-cat.dragging .stash-empty {
  visibility: hidden;
}

.edit-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 2px 8px;
}

.edit-tools .btn {
  flex: 0 0 auto;
}

/* 松手后的落点占位：插进去以后其它方块会被挤开，位置一目了然 */
.drop-slot {
  /* 关键：占位槽本身必须对指针透明。
     否则它一插进网格就成了 dragover 的目标，落点会被算到"空白处"，
     槽被甩到列表末尾，下一帧再跳回来 —— 看起来就是整片列表在闪。 */
  pointer-events: none;
  border: 1px dashed rgba(108, 245, 210, 0.85);
  border-radius: 8px;
  background: rgba(108, 245, 210, 0.12);
  box-shadow: 0 0 0 1px rgba(108, 245, 210, 0.25) inset;
  animation: slot-pulse 1.1s ease-in-out infinite;
}

.edit-grid > .drop-slot {
  height: 62px;
}

#palette-list > .drop-slot {
  height: 44px;
  margin-bottom: 7px;
}

@keyframes slot-pulse {
  0%,
  100% {
    background: rgba(108, 245, 210, 0.07);
  }
  50% {
    background: rgba(108, 245, 210, 0.2);
  }
}

#palette-list .add-cat {
  display: block;
  width: 100%;
  height: 28px;
  margin-top: 4px;
  border-style: dashed;
  color: var(--dim);
}

#palette-list .add-cat:hover {
  color: var(--text);
  border-color: var(--line-strong);
}

.grip {
  color: var(--dim);
  font-size: 12px;
  letter-spacing: -1.5px;
  user-select: none;
}

.stash-sec {
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  min-height: 46px;
}

.stash-sec .edit-grid {
  padding: 4px 8px 9px;
}

.stash-sec.drop-target {
  background: rgba(108, 245, 210, 0.08);
  outline: 1px dashed var(--accent);
}

.stash-empty {
  margin: 2px 2px 6px;
  font-size: 11px;
  color: var(--dim);
  line-height: 1.5;
}

#palette header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px 6px;
  border-bottom: 1px solid var(--line);
}

#palette h3 {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--dim);
  text-transform: uppercase;
}

#palette header .icon {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  border-radius: 6px;
}

#palette header .icon:hover {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
}

#palette.collapsed header .icon {
  transform: rotate(180deg);
}

#palette-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(120, 200, 220, 0.25) transparent;
}

#palette-list::-webkit-scrollbar {
  width: 7px;
}

#palette-list::-webkit-scrollbar-thumb {
  background: rgba(120, 200, 220, 0.22);
  border-radius: 4px;
}

.cat-title {
  margin: 6px 2px 5px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--dim);
  text-transform: uppercase;
}

.pat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: 5px;
  margin-bottom: 6px;
}

.pat {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 2px 4px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.022);
  cursor: pointer;
  transition:
    border-color 0.14s,
    background 0.14s,
    transform 0.1s;
}

.pat:hover {
  border-color: var(--line-strong);
  background: rgba(108, 245, 210, 0.07);
}

.pat.active {
  border-color: rgba(108, 245, 210, 0.75);
  background: var(--accent-dim);
  box-shadow: inset 0 0 0 1px rgba(108, 245, 210, 0.25);
}

.pat canvas {
  width: 100%;
  height: 38px;
  display: block;
  image-rendering: pixelated;
}

.pat span {
  font-size: 10px;
  color: var(--dim);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pat.active span {
  color: var(--accent);
}

#palette footer {
  display: flex;
  gap: 6px;
  padding: 8px;
  border-top: 1px solid var(--line);
}

#palette footer button {
  flex: 1;
  height: 28px;
  font-size: 11.5px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  cursor: pointer;
}

#palette footer button:hover {
  background: rgba(108, 245, 210, 0.1);
  border-color: var(--line-strong);
}

#hint {
  position: absolute;
  left: 12px;
  bottom: 12px;
  display: flex;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(8, 13, 18, 0.72);
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 11px;
  pointer-events: none;
  backdrop-filter: blur(6px);
}

#hint i {
  font-style: normal;
  opacity: 0.45;
}

#rec-badge {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(60, 12, 12, 0.85);
  border: 1px solid rgba(255, 122, 122, 0.45);
  color: #ffc9c9;
  font-size: 11.5px;
  letter-spacing: 0.04em;
  pointer-events: none;
}

#rec-badge b {
  color: #fff;
  font-variant-numeric: tabular-nums;
}

/* ---------- 底栏 ---------- */
#bottombar {
  display: grid;
  grid-template-columns: auto minmax(220px, 1fr) minmax(160px, 1.1fr) auto;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  background: var(--panel-solid);
  border-top: 1px solid var(--line);
}

.play {
  display: flex;
  align-items: center;
  gap: 5px;
}

.play button {
  height: 30px;
  min-width: 34px;
  padding: 0 9px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
  font-size: 12px;
}

.play button:hover {
  background: rgba(108, 245, 210, 0.1);
  border-color: var(--line-strong);
}

.play button.primary {
  min-width: 46px;
  color: #04120f;
  font-weight: 700;
  background: var(--accent);
  border-color: transparent;
  box-shadow: 0 0 16px rgba(108, 245, 210, 0.35);
}

.play button.primary:hover {
  filter: brightness(1.08);
}

.speed,
.timeline {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.speed label,
.timeline span#timeline-label,
.speed span#speed-label {
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
}

.speed span#speed-label {
  min-width: 64px;
  text-align: right;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.timeline span#timeline-label {
  min-width: 74px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: #9fd8ff;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  min-width: 60px;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, rgba(108, 245, 210, 0.55), rgba(53, 184, 255, 0.45));
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #eafff9;
  border: 2px solid #0b1a1f;
  box-shadow: 0 0 8px rgba(108, 245, 210, 0.7);
}

input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #eafff9;
  border: 2px solid #0b1a1f;
}

.rec {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

.rec-depth {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--dim);
  white-space: nowrap;
  cursor: default;
}

.rec-depth select {
  height: 28px;
}

/* ---------- 模态框 ---------- */
#modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
}

#modal.hidden {
  display: none;
}

.modal-mask {
  position: absolute;
  inset: 0;
  background: rgba(2, 5, 8, 0.72);
  backdrop-filter: blur(3px);
}

.modal-card {
  position: relative;
  width: min(880px, calc(100vw - 48px));
  max-height: min(80vh, 720px);
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  background: #0b1219;
  border: 1px solid var(--line-strong);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
  overflow: hidden;
}

.modal-card > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}

.modal-card h2 {
  margin: 0;
  font-size: 14px;
  letter-spacing: 0.04em;
}

#modal-body {
  padding: 14px;
  overflow: auto;
}

#modal.close-anim {
  opacity: 0;
}

/* ---------- 通用小组件 ---------- */
.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.grow {
  flex: 1;
}

.muted {
  color: var(--dim);
}

.small {
  font-size: 11.5px;
}

.hidden {
  display: none !important;
}

.tool-sep {
  height: 1px;
  margin: 3px 4px;
  background: var(--line);
}

/* 全局悬浮提示层：position:fixed 挂在 body 末尾，
   不放在按钮内部——否则会被顶栏的 overflow:hidden 或横向滚动容器裁掉 */
#tip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 200;
  pointer-events: none;
  padding: 5px 9px;
  border-radius: 6px;
  background: rgba(9, 16, 22, 0.97);
  border: 1px solid var(--line-strong);
  color: var(--text);
  font-size: 11.5px;
  line-height: 1.3;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

/* ---------- 游戏风格的确认框 ---------- */
#confirm {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  background: rgba(2, 5, 8, 0.66);
  backdrop-filter: blur(3px);
  animation: confirm-in 0.12s ease-out;
}

.confirm-card {
  width: min(400px, calc(100vw - 44px));
  padding: 18px 20px 16px;
  border-radius: 14px;
  background: var(--panel-solid);
  border: 1px solid rgba(108, 245, 210, 0.28);
  box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6);
  animation: confirm-pop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

.confirm-card h4 {
  margin: 0 0 10px;
  font-size: 15px;
  color: var(--text);
}

.confirm-card p {
  margin: 0 0 18px;
  font-size: 13px;
  line-height: 1.75;
  color: var(--dim);
  white-space: pre-line;
}

.confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

#confirm-ok {
  background: rgba(108, 245, 210, 0.16);
  border-color: rgba(108, 245, 210, 0.6);
  color: var(--accent);
}

@keyframes confirm-in {
  from {
    opacity: 0;
  }
}

@keyframes confirm-pop {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.97);
  }
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 10px;
}

.snap-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.022);
  overflow: hidden;
  cursor: pointer;
  transition:
    border-color 0.14s,
    transform 0.12s;
}

.snap-card:hover {
  border-color: rgba(108, 245, 210, 0.55);
  transform: translateY(-1px);
}

.snap-card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: #0a1017;
}

.snap-meta {
  padding: 6px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.snap-meta b {
  font-size: 11.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.snap-meta span {
  font-size: 10px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

.snap-actions {
  display: flex;
  gap: 5px;
  padding: 0 8px 8px;
}

.snap-actions button {
  flex: 1;
  height: 24px;
  font-size: 10.5px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
}

.snap-actions button:hover {
  background: rgba(108, 245, 210, 0.12);
}

.empty {
  padding: 34px 12px;
  text-align: center;
  color: var(--dim);
  font-size: 12px;
  border: 1px dashed var(--line);
  border-radius: 10px;
}

textarea.rle {
  width: 100%;
  min-height: 220px;
  resize: vertical;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #070c11;
  color: var(--text);
  font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  outline: none;
}

textarea.rle:focus {
  border-color: var(--line-strong);
}

.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.btn.primary {
  color: #04120f;
  background: var(--accent);
  border-color: transparent;
  font-weight: 600;
}

.btn.primary:hover {
  filter: brightness(1.08);
}

.input {
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #070c11;
  outline: none;
}

.input:focus {
  border-color: var(--line-strong);
}

kbd {
  display: inline-block;
  min-width: 18px;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  background: rgba(255, 255, 255, 0.05);
  font: 10.5px/1.5 ui-monospace, Consolas, monospace;
  text-align: center;
  color: var(--text);
}

/* ---------- 内容库：一级页签 ---------- */
.studio {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.studio-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line);
}

.studio-tab {
  flex: 1 1 0;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--dim);
  font-size: 12.5px;
  cursor: pointer;
  transition: color 0.12s, background 0.12s;
}

.studio-tab:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
}

.studio-tab.active {
  color: #04120f;
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(108, 245, 210, 0.22);
}

.studio-panel {
  min-height: 250px;
  max-height: min(56vh, 470px);
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(108, 245, 210, 0.3) transparent;
}

/* ---------- 操作说明：左侧分区 + 按键列对齐 ---------- */
.help {
  display: flex;
  gap: 18px;
  height: min(58vh, 520px);
}

.help-nav {
  flex: 0 0 116px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.help-tab {
  text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--dim);
  font-size: 12.5px;
  cursor: pointer;
}

.help-tab:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
}

.help-tab.active {
  color: var(--accent);
  background: rgba(108, 245, 210, 0.1);
  border-color: rgba(108, 245, 210, 0.28);
}

.help-main {
  flex: 1 1 auto;
  min-width: 0;
  overflow-y: auto;
  padding-right: 10px;
  scrollbar-width: thin;
  scrollbar-color: rgba(108, 245, 210, 0.32) transparent;
}

.help-rows {
  display: flex;
  flex-direction: column;
}

.help-row {
  display: grid;
  grid-template-columns: 152px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}

.help-row:first-child {
  border-top: none;
  padding-top: 2px;
}

.help-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.help-keys kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 21px;
  padding: 2px 7px;
  font-size: 11px;
  white-space: nowrap;
}

.help-row p {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--dim);
}

.help-note {
  margin: 16px 0 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(108, 245, 210, 0.06);
  border: 1px solid rgba(108, 245, 210, 0.16);
  color: var(--dim);
  font-size: 12px;
  line-height: 1.7;
}

/* 弹窗里的滚动条统一改成细的 accent 风格，别用系统原生的亮条 */
#modal-body {
  scrollbar-width: thin;
  scrollbar-color: rgba(108, 245, 210, 0.3) transparent;
}

#modal-body::-webkit-scrollbar,
.help-main::-webkit-scrollbar,
.studio-panel::-webkit-scrollbar,
#palette-list::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

#modal-body::-webkit-scrollbar-track,
.help-main::-webkit-scrollbar-track,
.studio-panel::-webkit-scrollbar-track,
#palette-list::-webkit-scrollbar-track {
  background: transparent;
}

#modal-body::-webkit-scrollbar-thumb,
.help-main::-webkit-scrollbar-thumb,
.studio-panel::-webkit-scrollbar-thumb,
#palette-list::-webkit-scrollbar-thumb {
  background: rgba(108, 245, 210, 0.26);
  border-radius: 999px;
  border: 3px solid transparent;
  background-clip: padding-box;
}

#modal-body::-webkit-scrollbar-thumb:hover,
.help-main::-webkit-scrollbar-thumb:hover,
.studio-panel::-webkit-scrollbar-thumb:hover,
#palette-list::-webkit-scrollbar-thumb:hover {
  background: rgba(108, 245, 210, 0.45);
  background-clip: padding-box;
}

@media (max-width: 760px) {
  .help {
    flex-direction: column;
    height: auto;
  }

  .help-nav {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .help-main {
    max-height: 52vh;
  }

  .help-row {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .studio-tab {
    font-size: 11.5px;
    padding: 7px 6px;
  }
}

/* 片段播放器 */
/* ---------- 可缩放的小画布（快照预览 / 片段播放器） ---------- */
.modal-card.wide {
  width: min(1080px, calc(100vw - 40px));
  max-height: min(90vh, 800px);
}

#modal-body.no-scroll {
  overflow: hidden;
  padding: 12px 14px 14px;
}

.pane {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #05080c;
  cursor: grab;
  touch-action: none;
}

.pane.grabbing {
  cursor: grabbing;
}

.pane canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.pane-hint {
  position: absolute;
  left: 10px;
  bottom: 8px;
  font-size: 11px;
  color: var(--dim);
  pointer-events: none;
  opacity: 0.75;
}

.pane-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 10px;
  flex: 0 0 auto;
}

#snap-view {
  height: min(54vh, 430px);
}

.clip-player {
  display: flex;
  flex-direction: column;
  height: min(64vh, 560px);
}

.clip-player.bare {
  height: min(74vh, 660px);
}

.clip-player.bare .pane-bar {
  display: none;
}

.clip-badge {
  position: absolute;
  right: 10px;
  top: 8px;
  font-size: 11px;
  color: var(--dim);
  background: rgba(6, 12, 16, 0.62);
  padding: 2px 7px;
  border-radius: 6px;
  pointer-events: none;
}

.clip-showbar {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid rgba(108, 245, 210, 0.34);
  background: rgba(8, 16, 20, 0.86);
  color: var(--accent);
  font-size: 12px;
  cursor: pointer;
}

.clip-showbar:hover {
  background: rgba(12, 26, 30, 0.95);
}

.clip-player:fullscreen {
  height: 100%;
  width: 100%;
  padding: 10px;
  background: #05080c;
}

.clip-player:fullscreen .pane {
  border-radius: 0;
  border-color: transparent;
}

/* 旧的片段舞台规则（保留给其它地方用） */
.clip-stage {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #05080c;
  aspect-ratio: 16 / 10;
}

.clip-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 78px;
  transform: translate(-50%, 10px);
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(10, 22, 26, 0.94);
  border: 1px solid rgba(108, 245, 210, 0.4);
  color: var(--accent);
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s,
    transform 0.2s;
  z-index: 80;
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- 框选工具条 ---------- */
#sel-bar {
  position: absolute;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 9px 7px 14px;
  border-radius: 999px;
  background: rgba(11, 20, 26, 0.95);
  border: 1px solid rgba(108, 245, 210, 0.34);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
  font-size: 12px;
  z-index: 30;
}

#sel-info {
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

#sel-bar button {
  height: 26px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
}

#sel-bar button:hover {
  background: rgba(255, 255, 255, 0.06);
}

#sel-bar button.primary {
  color: #04120f;
  background: var(--accent);
  border-color: transparent;
  font-weight: 600;
}

/* ---------- 存为图案 ---------- */
.preset-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.preset-preview {
  align-self: center;
  max-width: 100%;
  border-radius: 8px;
  border: 1px solid var(--line);
  image-rendering: pixelated;
}

.preset-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.preset-row label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 11.5px;
  color: var(--dim);
}

.preset-row label:first-child {
  flex: 1;
  min-width: 180px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.modal-note {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--dim);
}

/* ---------- 图案库管理 ---------- */
.lib-sec {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 18px;
}

.lib-sec h4 {
  margin: 0 0 2px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.04em;
}

.lib-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lib-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 340px;
  overflow: auto;
  padding-right: 4px;
}

.lib-name {
  font-size: 12.5px;
}

.lib-count {
  font-size: 11px;
  color: var(--dim);
  min-width: 38px;
  text-align: right;
}

.lib-icon {
  border-radius: 5px;
  background: #070c11;
  border: 1px solid var(--line);
}

.text-input,
.select-input {
  height: 28px;
  padding: 0 9px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background-color: #070c11;
  color: var(--text);
  font: 12px/1 inherit;
  outline: none;
}

.select-input {
  padding-right: 24px;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%238ba7b3' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 8px center;
}

.text-input:focus,
.select-input:focus {
  border-color: var(--line-strong);
}

.text-input.grow {
  flex: 1;
  min-width: 0;
}

.btn.tiny {
  height: 26px;
  min-width: 26px;
  padding: 0 8px;
  font-size: 11.5px;
}

.btn.tiny.danger {
  color: var(--danger);
  border-color: rgba(255, 122, 122, 0.35);
}

@media (max-width: 1100px) {
  .brand-text small {
    display: none;
  }
  .stats .stat:nth-child(4) {
    display: none;
  }
  #topbar {
    gap: 12px;
    padding: 0 10px;
  }
  .top-actions {
    gap: 4px;
  }
  .top-actions .btn,
  .top-actions .chip,
  .top-actions select {
    padding: 0 7px;
    font-size: 12px;
  }
  #bottombar {
    grid-template-columns: auto minmax(150px, 1fr) minmax(130px, 1fr) auto;
    gap: 10px;
  }
  #palette {
    width: 190px;
  }
}

/* 手机竖屏：工具栏与图案库浮在画布上，底栏折成三行 */
@media (max-width: 700px) {
  #app {
    grid-template-rows: 46px minmax(0, 1fr) auto;
  }
  .brand-text {
    display: none;
  }
  .stats {
    gap: 10px;
    flex: 0 0 auto;
  }
  .top-actions {
    gap: 4px;
    flex: 1 1 auto;
    min-width: 0;
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    scrollbar-width: none;
    padding-left: 4px;
    mask-image: linear-gradient(to right, #000 88%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, #000 88%, transparent 100%);
  }
  .top-actions::-webkit-scrollbar {
    display: none;
  }
  .stats .stat:nth-child(3),
  .stats .stat:nth-child(4) {
    display: none;
  }
  .top-actions .btn,
  .top-actions .chip,
  .top-actions select {
    height: 28px;
    padding: 0 7px;
    font-size: 12px;
    flex: 0 0 auto;
  }
  #palette {
    width: 200px;
    right: 8px;
    top: 8px;
    bottom: auto;
    max-height: 62%;
  }
  #toolbar {
    left: 6px;
    top: 8px;
    padding: 5px;
    gap: 4px;
  }
  #toolbar .tool {
    width: 34px;
    height: 34px;
    font-size: 15px;
  }
  #bottombar {
    grid-template-columns: 1fr auto;
    gap: 6px 10px;
    padding: 6px 10px;
  }
  .play {
    flex-wrap: nowrap;
    gap: 4px;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .play::-webkit-scrollbar {
    display: none;
  }
  .play button {
    height: 26px;
    min-width: 26px;
    padding: 0 5px;
    font-size: 12px;

      if (!document.fullscreenElement && immersive) void exitImmersive();
    });
    document.addEventListener("pointermove", () => {
      if (immersive) {
        updateFsBar();
        pokeFsBar();
      }
    });
    requestAnimationFrame(loop);
    window.setInterval(() => void autoSaveNow(), 15e3);
    window.addEventListener("pagehide", () => void autoSaveNow());
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") void autoSaveNow();
    });
    if (auto) toast(`已恢复上次的现场（第 ${nf.format(auto.gen)} 代）`);
  }
  void boot();
})();
</script>
  </body>
</html>
