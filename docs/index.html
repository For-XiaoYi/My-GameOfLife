<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>生命游戏 · Conway's Game of Life</title>
    <style>
:root {
  --bg: #05080c;
  --panel: rgba(13, 20, 28, 0.92);
  --panel-solid: #0d141c;
  --line: rgba(120, 200, 220, 0.14);
  --line-strong: rgba(120, 200, 220, 0.28);
  --text: #dbe9ee;
  --dim: #7b939e;
  --accent: #6cf5d2;
  --accent-dim: rgba(108, 245, 210, 0.16);
  --danger: #ff7a7a;
  --radius: 10px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
select,
input {
  font: inherit;
  color: inherit;
}

#app {
  display: grid;
  grid-template-rows: 52px minmax(0, 1fr) 58px;
  height: 100dvh;
  width: 100vw;
}

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 14px;
  background: var(--panel-solid);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
}

.logo {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background:
    radial-gradient(circle at 30% 30%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 70% 30%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 50% 62%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 30% 88%, var(--accent) 0 2px, transparent 2.5px),
    radial-gradient(circle at 70% 88%, var(--accent) 0 2px, transparent 2.5px),
    #101c25;
  box-shadow: 0 0 0 1px var(--line-strong), 0 0 16px rgba(108, 245, 210, 0.18);
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.brand-text strong {
  font-size: 14px;
  letter-spacing: 0.04em;
}

.brand-text small {
  font-size: 9.5px;
  color: var(--dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.stats {
  display: flex;
  gap: 4px;
  flex: 0 0 auto;
}

.stat {
  display: flex;
  align-items: baseline;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.028);
  border: 1px solid transparent;
}

.stat label {
  font-size: 10.5px;
  color: var(--dim);
  letter-spacing: 0.05em;
}

.stat b {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 13px;
  color: var(--accent);
}

.stat i {
  font-style: normal;
  font-size: 10px;
  color: var(--dim);
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

select,
.btn,
.chip {
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
  transition:
    background 0.14s,
    border-color 0.14s,
    color 0.14s;
  white-space: nowrap;
}

select {
  padding: 0 6px;
  appearance: none;
  text-align: center;
}

.btn:hover,
.chip:hover,
select:hover {
  background: rgba(108, 245, 210, 0.1);
  border-color: var(--line-strong);
}

.chip.on {
  background: var(--accent-dim);
  border-color: rgba(108, 245, 210, 0.5);
  color: var(--accent);
}

.btn.icon,
button.icon {
  width: 30px;
  padding: 0;
  display: inline-grid;
  place-items: center;
}

.btn.danger {
  color: #ffb4b4;
  border-color: rgba(255, 122, 122, 0.32);
}

.btn.danger.on {
  background: rgba(255, 90, 90, 0.2);
  border-color: rgba(255, 122, 122, 0.7);
  color: #fff;
}

/* ---------- 舞台 ---------- */
#stage {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  touch-action: none;
}

#board {
  position: absolute;
  inset: 0;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

#stage.panning #board {
  cursor: grabbing;
}

#toolbar {
  position: absolute;
  left: 12px;
  top: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

.tool {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
}

.tool:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
}

.tool.active {
  color: #04120f;
  background: var(--accent);
  box-shadow: 0 0 14px rgba(108, 245, 210, 0.45);
}

#palette {
  position: absolute;
  right: 12px;
  top: 12px;
  bottom: 12px;
  width: 236px;
  display: flex;
  flex-direction: column;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  overflow: hidden;
  transition: width 0.16s ease;
}

#palette.collapsed {
  width: 42px;
}

#palette.collapsed #palette-list,
#palette.collapsed footer,
#palette.collapsed header h3 {
  display: none;
}

#palette.collapsed header {
  justify-content: center;
}

#palette header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px 6px;
  border-bottom: 1px solid var(--line);
}

#palette h3 {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--dim);
  text-transform: uppercase;
}

#palette header .icon {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  border-radius: 6px;
}

#palette header .icon:hover {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
}

#palette.collapsed header .icon {
  transform: rotate(180deg);
}

#palette-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(120, 200, 220, 0.25) transparent;
}

#palette-list::-webkit-scrollbar {
  width: 7px;
}

#palette-list::-webkit-scrollbar-thumb {
  background: rgba(120, 200, 220, 0.22);
  border-radius: 4px;
}

.cat-title {
  margin: 6px 2px 5px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--dim);
  text-transform: uppercase;
}

.pat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-bottom: 6px;
}

.pat {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 2px 4px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.022);
  cursor: pointer;
  transition:
    border-color 0.14s,
    background 0.14s,
    transform 0.1s;
}

.pat:hover {
  border-color: var(--line-strong);
  background: rgba(108, 245, 210, 0.07);
}

.pat.active {
  border-color: rgba(108, 245, 210, 0.75);
  background: var(--accent-dim);
  box-shadow: inset 0 0 0 1px rgba(108, 245, 210, 0.25);
}

.pat canvas {
  width: 100%;
  height: 38px;
  display: block;
  image-rendering: pixelated;
}

.pat span {
  font-size: 10px;
  color: var(--dim);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pat.active span {
  color: var(--accent);
}

#palette footer {
  display: flex;
  gap: 6px;
  padding: 8px;
  border-top: 1px solid var(--line);
}

#palette footer button {
  flex: 1;
  height: 28px;
  font-size: 11.5px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  cursor: pointer;
}

#palette footer button:hover {
  background: rgba(108, 245, 210, 0.1);
  border-color: var(--line-strong);
}

#hint {
  position: absolute;
  left: 12px;
  bottom: 12px;
  display: flex;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(8, 13, 18, 0.72);
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 11px;
  pointer-events: none;
  backdrop-filter: blur(6px);
}

#hint i {
  font-style: normal;
  opacity: 0.45;
}

#rec-badge {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(60, 12, 12, 0.85);
  border: 1px solid rgba(255, 122, 122, 0.45);
  color: #ffc9c9;
  font-size: 11.5px;
  letter-spacing: 0.04em;
  pointer-events: none;
}

#rec-badge b {
  color: #fff;
  font-variant-numeric: tabular-nums;
}

/* ---------- 底栏 ---------- */
#bottombar {
  display: grid;
  grid-template-columns: auto minmax(220px, 1fr) minmax(160px, 1.1fr) auto;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  background: var(--panel-solid);
  border-top: 1px solid var(--line);
}

.play {
  display: flex;
  align-items: center;
  gap: 5px;
}

.play button {
  height: 30px;
  min-width: 34px;
  padding: 0 9px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
  font-size: 12px;
}

.play button:hover {
  background: rgba(108, 245, 210, 0.1);
  border-color: var(--line-strong);
}

.play button.primary {
  min-width: 46px;
  color: #04120f;
  font-weight: 700;
  background: var(--accent);
  border-color: transparent;
  box-shadow: 0 0 16px rgba(108, 245, 210, 0.35);
}

.play button.primary:hover {
  filter: brightness(1.08);
}

.speed,
.timeline {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.speed label,
.timeline span#timeline-label,
.speed span#speed-label {
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
}

.speed span#speed-label {
  min-width: 64px;
  text-align: right;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.timeline span#timeline-label {
  min-width: 74px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: #9fd8ff;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  min-width: 60px;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, rgba(108, 245, 210, 0.55), rgba(53, 184, 255, 0.45));
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #eafff9;
  border: 2px solid #0b1a1f;
  box-shadow: 0 0 8px rgba(108, 245, 210, 0.7);
}

input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #eafff9;
  border: 2px solid #0b1a1f;
}

.rec {
  display: flex;
  justify-content: flex-end;
}

/* ---------- 模态框 ---------- */
#modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
}

#modal.hidden {
  display: none;
}

.modal-mask {
  position: absolute;
  inset: 0;
  background: rgba(2, 5, 8, 0.72);
  backdrop-filter: blur(3px);
}

.modal-card {
  position: relative;
  width: min(880px, calc(100vw - 48px));
  max-height: min(80vh, 720px);
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  background: #0b1219;
  border: 1px solid var(--line-strong);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
  overflow: hidden;
}

.modal-card > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}

.modal-card h2 {
  margin: 0;
  font-size: 14px;
  letter-spacing: 0.04em;
}

#modal-body {
  padding: 14px;
  overflow: auto;
}

#modal.close-anim {
  opacity: 0;
}

/* ---------- 通用小组件 ---------- */
.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.grow {
  flex: 1;
}

.muted {
  color: var(--dim);
}

.small {
  font-size: 11.5px;
}

.hidden {
  display: none !important;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 10px;
}

.snap-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.022);
  overflow: hidden;
  cursor: pointer;
  transition:
    border-color 0.14s,
    transform 0.12s;
}

.snap-card:hover {
  border-color: rgba(108, 245, 210, 0.55);
  transform: translateY(-1px);
}

.snap-card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: #0a1017;
}

.snap-meta {
  padding: 6px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.snap-meta b {
  font-size: 11.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.snap-meta span {
  font-size: 10px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

.snap-actions {
  display: flex;
  gap: 5px;
  padding: 0 8px 8px;
}

.snap-actions button {
  flex: 1;
  height: 24px;
  font-size: 10.5px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
}

.snap-actions button:hover {
  background: rgba(108, 245, 210, 0.12);
}

.empty {
  padding: 34px 12px;
  text-align: center;
  color: var(--dim);
  font-size: 12px;
  border: 1px dashed var(--line);
  border-radius: 10px;
}

textarea.rle {
  width: 100%;
  min-height: 220px;
  resize: vertical;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #070c11;
  color: var(--text);
  font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  outline: none;
}

textarea.rle:focus {
  border-color: var(--line-strong);
}

.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.btn.primary {
  color: #04120f;
  background: var(--accent);
  border-color: transparent;
  font-weight: 600;
}

.btn.primary:hover {
  filter: brightness(1.08);
}

.input {
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #070c11;
  outline: none;
}

.input:focus {
  border-color: var(--line-strong);
}

kbd {
  display: inline-block;
  min-width: 18px;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  background: rgba(255, 255, 255, 0.05);
  font: 10.5px/1.5 ui-monospace, Consolas, monospace;
  text-align: center;
  color: var(--text);
}

.help-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 7px 14px;
  font-size: 12px;
}

.help-list dt {
  color: var(--dim);
}

/* 片段播放器 */
.clip-stage {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #05080c;
  aspect-ratio: 16 / 10;
}

.clip-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 78px;
  transform: translate(-50%, 10px);
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(10, 22, 26, 0.94);
  border: 1px solid rgba(108, 245, 210, 0.4);
  color: var(--accent);
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s,
    transform 0.2s;
  z-index: 80;
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 900px) {
  .brand-text small {
    display: none;
  }
  .stats .stat:nth-child(4) {
    display: none;
  }
  #bottombar {
    grid-template-columns: auto 1fr auto;
  }
  .timeline {
    display: none;
  }
  #palette {
    width: 190px;
  }
}
</style>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo"></span>
          <div class="brand-text">
            <strong>生命游戏</strong>
            <small>Conway's Game of Life</small>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><label>代数</label><b id="stat-gen">0</b></div>
          <div class="stat"><label>人口</label><b id="stat-pop">0</b></div>
          <div class="stat"><label>速度</label><b id="stat-speed">10</b><i>代/秒</i></div>
          <div class="stat"><label>可回溯</label><b id="stat-hist">1</b><i>代</i></div>
        </div>

        <div class="top-actions">
          <select id="sel-size" title="世界尺寸">
            <option value="512">512 × 512</option>
            <option value="1024" selected>1024 × 1024</option>
            <option value="2048">2048 × 2048</option>
          </select>
          <select id="sel-edge" title="边界规则">
            <option value="wrap">环绕边界</option>
            <option value="dead">死亡边界</option>
          </select>
          <button class="chip" id="tgl-grid" title="网格 (G)">网格</button>
          <button class="chip" id="tgl-glow" title="光晕 (L)">光晕</button>
          <button class="btn" id="btn-snapshots">存档</button>
          <button class="btn" id="btn-clips">片段</button>
          <button class="btn" id="btn-rle">RLE</button>
          <button class="btn icon" id="btn-help" title="帮助">?</button>
        </div>
      </header>

      <main id="stage">
        <canvas id="board"></canvas>

        <div id="toolbar">
          <button class="tool active" data-tool="brush" title="画笔 (B)">✎</button>
          <button class="tool" data-tool="erase" title="橡皮 (E)">⌫</button>
          <button class="tool" data-tool="line" title="直线 (L)">╱</button>
          <button class="tool" data-tool="rect" title="矩形 (U)">▭</button>
          <button class="tool" data-tool="stamp" title="贴图 (S)">▣</button>
          <button class="tool" data-tool="pan" title="平移 (H / 右键)">✋</button>
        </div>

        <aside id="palette">
          <header>
            <h3>图案库</h3>
            <button id="btn-palette-collapse" class="icon" title="收起">›</button>
          </header>
          <div id="palette-list"></div>
          <footer>
            <button id="btn-rotate" title="旋转 (R)">旋转 0°</button>
            <button id="btn-mirror" title="镜像 (M)">镜像</button>
          </footer>
        </aside>

        <div id="hint">
          <span>拖拽绘制</span><i>·</i><span>右键 / 空格拖拽平移</span><i>·</i><span>滚轮缩放</span>
        </div>

        <div id="rec-badge" class="hidden">● 录制中 <b id="rec-count">0</b> 代</div>
      </main>

      <footer id="bottombar">
        <div class="play">
          <button id="btn-prev" title="上一代 (←)">◀</button>
          <button id="btn-play" class="primary" title="播放 / 暂停 (P)">▶</button>
          <button id="btn-next" title="下一代 (→)">▶|</button>
          <button id="btn-clear" title="清空世界">清空</button>
          <button id="btn-random" title="随机播种">随机</button>
        </div>

        <div class="speed">
          <label for="speed">速度</label>
          <input id="speed" type="range" min="0" max="100" step="1" value="52" />

      world = new World(rec.width, rec.height);

      world.loadPacked(rec.packed, rec.population, rec.gen);
      history = new History(world);
      renderer.attach(world);
    } else {
      world.edge = rec.edge;
      world.loadPacked(rec.packed, rec.population, rec.gen);
      history.reset();
      renderer.paintAll();
    }
    el("sel-size").value = String(rec.width);
    el("sel-edge").value = rec.edge;
    view.setView(rec.view);
    uiDirty = true;
    flushUi();
    toast(`已载入「${rec.name}」`);
  }
  async function toggleRecord() {
    const btn = el("btn-record");
    if (state.recordStart < 0) {
      state.recordStart = world.gen;
      history.protectedRange = { from: world.gen, to: world.gen };
      btn.classList.add("on");
      btn.textContent = "■ 停止录制";
      if (!state.playing) setPlaying(true);
      updateRecordBadge();
      toast("开始录制，按「停止」后即可回放");
      return;
    }
    const start = state.recordStart;
    state.recordStart = -1;
    history.protectedRange = null;
    btn.classList.remove("on");
    btn.textContent = "● 录制片段";
    updateRecordBadge();
    const clip = history.extractClip(start, world.gen);
    if (!clip) {
      toast("片段太短，未保存");
      return;
    }
    const rec = {
      id: uid(),
      name: `第 ${nf.format(clip.startGen)}–${nf.format(clip.endGen)} 代`,
      created: Date.now(),
      width: world.width,
      height: world.height,
      startGen: clip.startGen,
      endGen: clip.endGen,
      startPacked: clip.start.packed,
      startPopulation: clip.start.population,
      deltas: clip.deltas,
      thumb: makeThumb(world, 192)
    };
    await store.saveClip(rec);
    toast(`片段已保存（${clip.deltas.length} 代）`);
    void openClips();
  }
  async function openClips() {
    openModal("片段库", (body) => {
      const grid = document.createElement("div");
      grid.className = "card-grid";
      body.append(grid);
      const refresh = async () => {
        const list = await store.listClips();
        list.sort((a, b) => b.created - a.created);
        grid.innerHTML = "";
        if (!list.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "还没有片段。点底栏「录制片段」开始录，停止后自动出现在这里。";
          grid.style.gridTemplateColumns = "1fr";
          grid.append(empty);
          return;
        }
        grid.style.gridTemplateColumns = "";
        for (const rec of list) grid.append(clipCard(rec, refresh));
      };
      void refresh();
    });
  }
  function clipCard(rec, refresh) {
    const card = document.createElement("div");
    card.className = "snap-card";
    card.innerHTML = `
    <img alt="" src="${rec.thumb}">
    <div class="snap-meta"><b></b><span class="m1"></span><span class="m2"></span></div>
    <div class="snap-actions">
      <button data-act="play">播放</button>
      <button data-act="del">删除</button>
    </div>`;
    card.querySelector("b").textContent = rec.name;
    card.querySelector(".m1").textContent = `${rec.deltas.length} 代 · 起点人口 ${nf.format(rec.startPopulation)}`;
    card.querySelector(".m2").textContent = `${rec.width}² · ${fmtTime(rec.created)}`;
    card.querySelector('[data-act="play"]').addEventListener("click", (e) => {
      e.stopPropagation();
      openClipPlayer(rec);
    });
    card.querySelector('[data-act="del"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      await store.deleteClip(rec.id);
      await refresh();
    });
    return card;
  }
  function openClipPlayer(rec) {
    openModal(`片段 · ${rec.name}`, (body) => {
      body.innerHTML = `
      <div class="clip-stage"><canvas id="clip-canvas"></canvas></div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="clip-play">▶ 播放</button>
        <input id="clip-seek" type="range" class="grow" min="0" max="${rec.deltas.length}" value="0" />
        <span class="small muted" id="clip-label" style="min-width:96px;text-align:right"></span>
      </div>`;
      const cvs = body.querySelector("#clip-canvas");
      const seekEl = body.querySelector("#clip-seek");
      const playEl = body.querySelector("#clip-play");
      const labelEl = body.querySelector("#clip-label");
      const w = new World(rec.width, rec.height);
      w.loadPacked(rec.startPacked, rec.startPopulation, rec.startGen);
      const r = new Renderer(cvs);
      r.attach(w);
      const v = new Viewport();
      const box = body.querySelector(".clip-stage");
      const rect = box.getBoundingClientRect();
      r.resize(rect.width || 640, rect.height || 400);
      let bx0 = Infinity;
      let by0 = Infinity;
      let bx1 = -Infinity;
      let by1 = -Infinity;
      const grow = () => {
        const bb = w.liveBBox();
        if (bb.x1 > bb.x0 && bb.y1 > bb.y0) {
          bx0 = Math.min(bx0, bb.x0);
          by0 = Math.min(by0, bb.y0);
          bx1 = Math.max(bx1, bb.x1);
          by1 = Math.max(by1, bb.y1);
        }
      };
      grow();
      for (const d of rec.deltas) {
        w.applyDelta(d);
        w.gen++;
        grow();
      }
      for (let i = rec.deltas.length - 1; i >= 0; i--) {
        w.revertDelta(rec.deltas[i]);
        w.gen--;
      }
      if (bx0 < Infinity) {
        const bw = Math.max(8, bx1 - bx0);
        const bh = Math.max(8, by1 - by0);
        const s = v.clampScale(Math.min((r.cssW - 28) / bw, (r.cssH - 28) / bh, 26));
        v.scale = s;
        v.ox = (r.cssW - bw * s) / 2 - bx0 * s;
        v.oy = (r.cssH - bh * s) / 2 - by0 * s;
      } else {
        v.fit(rec.width, rec.height, r.cssW, r.cssH, 16);
      }
      let idx = 0;
      let playing = false;
      let raf = 0;
      let last = 0;
      let acc = 0;
      const paint = () => {
        r.sync();
        r.render(v, { grid: false, glow: true });
        labelEl.textContent = `第 ${nf.format(rec.startGen + idx)} 代`;
      };
      const goTo = (target) => {
        const t = Math.max(0, Math.min(rec.deltas.length, target));
        while (idx < t) {
          w.applyDelta(rec.deltas[idx]);
          w.gen++;
          idx++;
        }
        while (idx > t) {
          idx--;
          w.revertDelta(rec.deltas[idx]);
          w.gen--;
        }
        seekEl.value = String(idx);
        paint();
      };
      const tick = (ts) => {
        if (!playing) return;
        const dt = last ? ts - last : 16;
        last = ts;
        acc += dt;
        if (acc >= 70) {
          acc = 0;
          goTo(idx + 1);
          if (idx >= rec.deltas.length) {
            playing = false;
            playEl.textContent = "▶ 播放";
          }
        }
        raf = requestAnimationFrame(tick);
      };
      playEl.addEventListener("click", () => {
        playing = !playing;
        playEl.textContent = playing ? "❙❙ 暂停" : "▶ 播放";
        if (playing) {
          if (idx >= rec.deltas.length) goTo(0);
          last = 0;
          acc = 0;
          raf = requestAnimationFrame(tick);
        }
      });
      seekEl.addEventListener("input", () => {
        playing = false;
        playEl.textContent = "▶ 播放";
        goTo(Number(seekEl.value));
      });
      paint();
      modalCleanup = () => {
        playing = false;
        cancelAnimationFrame(raf);
      };
    });
  }
  function openRle() {
    openModal("RLE 导入 / 导出", (body) => {
      body.innerHTML = `
      <p class="small muted" style="margin:0 0 8px">
        粘贴 LifeWiki 上的 RLE 或纯文本图案，导入到当前视图中心；也可以把整个世界导出成 RLE。
      </p>
      <textarea class="rle" id="rle-text" placeholder="x = 3, y = 3, rule = B3/S23&#10;bo$2bo$3o!"></textarea>
      <div class="btn-row">
        <button class="btn primary" id="rle-import">导入到世界</button>
        <button class="btn" id="rle-export">把世界导出到此处</button>
        <button class="btn" id="rle-download">下载 .rle</button>
      </div>`;
      const text = body.querySelector("#rle-text");
      body.querySelector("#rle-import").addEventListener("click", () => {
        const parsed = parsePatternText(text.value);
        if (!parsed) {
          toast("解析失败：看看是不是缺少 RLE 头或字符不合法");
          return;
        }
        if (state.playing) setPlaying(false);
        const cx = Math.floor((view.visibleWorld(renderer.cssW, renderer.cssH).x0 + view.visibleWorld(renderer.cssW, renderer.cssH).x1) / 2);
        const cy = Math.floor((view.visibleWorld(renderer.cssW, renderer.cssH).y0 + view.visibleWorld(renderer.cssW, renderer.cssH).y1) / 2);
        world.stamp(parsed.cells, parsed.width, parsed.height, cx - Math.floor(parsed.width / 2), cy - Math.floor(parsed.height / 2));
        commitEdit();
        closeModal();
        toast(`已导入 ${parsed.width}×${parsed.height} 图案`);
      });
      const exportTo = () => {
        const bb = world.liveBBox();
        const empty = bb.x1 <= bb.x0 || bb.y1 <= bb.y0;
        const x0 = empty ? 0 : bb.x0;
        const y0 = empty ? 0 : bb.y0;
        const w = empty ? 1 : bb.x1 - bb.x0;
        const h = empty ? 1 : bb.y1 - bb.y0;
        const cells = world.extract(x0, y0, w, h);
        return toRle({ width: w, height: h, cells }, { name: `gen-${world.gen}` });
      };
      body.querySelector("#rle-export").addEventListener("click", () => {
        text.value = exportTo();
        toast("已导出到文本框");
      });
      body.querySelector("#rle-download").addEventListener("click", () => {
        const blob = new Blob([exportTo()], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `life-gen-${world.gen}.rle`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4e3);
      });
    });
  }
  function openHelp() {
    openModal("操作说明", (body) => {
      body.innerHTML = `
      <dl class="help-list">
        <dt>拖拽</dt><dd>用当前工具绘制（画笔 / 橡皮 / 直线 / 矩形）</dd>
        <dt>右键 / 空格 + 拖拽</dt><dd>平移画布</dd>
        <dt>滚轮 / 双指</dt><dd>以光标为中心缩放（0.03× – 64×）</dd>
        <dt><kbd>B</kbd> <kbd>E</kbd> <kbd>I</kbd> <kbd>U</kbd> <kbd>S</kbd> <kbd>H</kbd></dt>
        <dd>画笔 / 橡皮 / 直线 / 矩形 / 贴图 / 平移</dd>
        <dt><kbd>R</kbd> <kbd>M</kbd></dt><dd>旋转 90°、左右镜像（贴图前）</dd>
        <dt><kbd>P</kbd></dt><dd>播放 / 暂停</dd>
        <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>时间轴上退一代 / 前进一代</dd>
        <dt><kbd>G</kbd> <kbd>O</kbd></dt><dd>网格、光晕开关</dd>
        <dt><kbd>0</kbd></dt><dd>缩放到整幅世界</dd>
        <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd>放大 / 缩小</dd>
        <dt><kbd>Del</kbd></dt><dd>清空世界</dd>
      </dl>
      <p class="small muted" style="margin-top:14px">
        回溯原理：程序记录每一代被翻转的格子（增量），并按固定间隔保存关键帧，
        所以拖动底栏进度条可以瞬时回到过去的任意一代。历史默认保留最近 3000 代。
      </p>`;
    });
  }
  async function autoSaveNow() {
    try {
      await store.setAutoSave({
        width: world.width,
        height: world.height,
        gen: world.gen,
        population: world.population,
        edge: world.edge,
        packed: world.toPacked(),
        view: view.getView(),
        savedAt: Date.now()
      });
    } catch {
    }
  }
  function bindUi() {
    for (const btn of document.querySelectorAll("#toolbar .tool")) {
      btn.addEventListener("click", () => setTool(btn.dataset.tool));
    }
    el("btn-play").addEventListener("click", () => setPlaying(!state.playing));
    el("btn-next").addEventListener("click", () => stepOnce(1));
    el("btn-prev").addEventListener("click", () => stepOnce(-1));
    el("btn-clear").addEventListener("click", clearWorld);
    el("btn-random").addEventListener("click", randomWorld);
    const speedEl = el("speed");
    speedEl.value = String(Math.round(speedToSlider(state.speed)));
    speedEl.addEventListener("input", () => {
      state.speed = sliderToSpeed(Number(speedEl.value));
      state.unlimited = false;
      el("btn-unlimited").classList.remove("on");
      uiDirty = true;
    });
    el("btn-unlimited").addEventListener("click", () => {
      state.unlimited = !state.unlimited;
      el("btn-unlimited").classList.toggle("on", state.unlimited);
      uiDirty = true;
    });
    const tl = el("timeline");
    tl.addEventListener("input", () => {
      if (state.playing) setPlaying(false);
      history.seek(Number(tl.value));
      renderer.sync();
      flushUi();
    });
    el("btn-record").addEventListener("click", () => void toggleRecord());
    el("btn-snapshots").addEventListener("click", () => void openSnapshots());
    el("btn-clips").addEventListener("click", () => void openClips());
    el("btn-rle").addEventListener("click", openRle);
    el("btn-help").addEventListener("click", openHelp);
    el("tgl-grid").addEventListener("click", toggleGrid);
    el("tgl-glow").addEventListener("click", toggleGlow);
    el("btn-rotate").addEventListener("click", rotatePattern);
    el("btn-mirror").addEventListener("click", mirrorPattern);
    el("btn-palette-collapse").addEventListener("click", () => {
      el("palette").classList.toggle("collapsed");
    });
    el("sel-size").addEventListener("change", (e) => {
      const size = Number(e.target.value);
      if (size === world.width) return;
      if (state.playing) setPlaying(false);
      rebuildWorld(size, size, world.edge, true);
      toast(`世界已重建为 ${size}×${size}`);
      flushUi();
    });
    el("sel-edge").addEventListener("change", (e) => {
      const mode = e.target.value;
      world.edge = mode;
      world.recompute();
      history.reset();
      renderer.paintAll();
      uiDirty = true;
      toast(mode === "wrap" ? "边界：环绕（左右上下相连）" : "边界：死亡（越界即消失）");
    });
    window.addEventListener("resize", () => {
      const r = stageEl.getBoundingClientRect();
      renderer.resize(r.width, r.height);
    });
  }
  async function boot() {
    store = new Store();
    try {
      await store.init();
    } catch {
    }
    renderer = new Renderer(canvas);
    let auto = null;
    try {
      auto = await store.getAutoSave();
    } catch {
      auto = null;
    }
    if (auto && auto.width > 0) {
      world = new World(auto.width, auto.height);
      world.edge = auto.edge;
      world.loadPacked(auto.packed, auto.population, auto.gen);
      el("sel-size").value = String(auto.width);
      el("sel-edge").value = auto.edge;
    } else {
      world = new World(1024, 1024);
      seedShowcase(world);
    }
    history = new History(world);
    renderer.attach(world);
    buildPalette();
    const r = stageEl.getBoundingClientRect();
    renderer.resize(r.width, r.height);
    if (auto && auto.view) view.setView(auto.view);
    else fitContent();
    bindUi();
    setPlaying(false);
    el("tgl-grid").classList.toggle("on", state.grid);
    el("tgl-glow").classList.toggle("on", state.glow);
    flushUi();
    Object.defineProperty(window, "__life", {
      configurable: true,
      value: {
        get world() {
          return world;
        },
        get history() {
          return history;
        },
        get view() {
          return view;
        },
        get store() {
          return store;
        },
        step(n = 1) {
          for (let i = 0; i < n; i++) advanceOne();
        },
        commit: () => commitEdit(),
        set(x, y, v) {
          world.set(x, y, v);
        },
        place(id, x, y) {
          const p = PATTERN_BY_ID.get(id);
          if (!p) return null;
          stampPattern(world, p, x, y, 0, false);
          commitEdit();
          return patternSize(p, 0);
        },
        fit: () => fitContent(),
        scale: (s) => {
          view.scale = view.clampScale(s);
          uiDirty = true;
        }
      }
    });
    new ResizeObserver(() => {
      const box = stageEl.getBoundingClientRect();
      if (box.width === 0 || box.height === 0) return;
      if (box.width === renderer.cssW && box.height === renderer.cssH) return;
      const w0 = view.screenToWorld(renderer.cssW / 2, renderer.cssH / 2);
      renderer.resize(box.width, box.height);
      const p0 = view.worldToScreen(w0.x, w0.y);
      view.panBy(box.width / 2 - p0.x, box.height / 2 - p0.y);
      uiDirty = true;
    }).observe(stageEl);
    requestAnimationFrame(loop);
    window.setInterval(() => void autoSaveNow(), 15e3);
    window.addEventListener("pagehide", () => void autoSaveNow());
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") void autoSaveNow();
    });
    if (auto) toast(`已恢复上次的现场（第 ${nf.format(auto.gen)} 代）`);
  }
  void boot();
})();
</script>
